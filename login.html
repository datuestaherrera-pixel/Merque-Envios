<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Iniciar Sesión | MerqueEnvios</title>
    <link rel="stylesheet" href="login.css">
    <!-- CryptoJS for SHA-256 password hashing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <!-- Firebase SDK (CDN compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
</head>
<body>

<!-- Pestaña "Iniciando sesión con Google" -->
<div id="overlay-google" class="overlay-google" style="display:none;">
    <div class="overlay-google-card">
        <img src="logo_google.png" alt="Google" width="32" height="32">
        <p>Iniciando sesión con Google...</p>
        <span class="spinner spinner-google"></span>
    </div>
</div>

<div class="login-container">

    <div class="logo">
        <img src="img/logo_merqueenvios.jpg" alt="Logo MerqueEnvios">
    </div>

    <h2>Iniciar Sesión</h2>

    <div id="alerta-error" class="alerta alerta-error" role="alert" aria-live="assertive" style="display:none;"></div>
    <div id="alerta-exito" class="alerta alerta-exito" role="alert" aria-live="assertive" style="display:none;"></div>

    <form id="loginForm" novalidate autocomplete="off">

        <div class="campo">
            <label for="email">Correo electrónico</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="correo@ejemplo.com"
                required
                autocomplete="username"
                maxlength="100"
                aria-describedby="email-error"
            >
            <span class="error-msg" id="email-error"></span>
        </div>

        <div class="campo">
            <label for="password">Contraseña</label>
            <div class="password-wrapper">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingresa tu contraseña"
                    required
                    autocomplete="current-password"
                    maxlength="64"
                    aria-describedby="password-error"
                >
                <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña" tabindex="-1">
                    <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
            <span class="error-msg" id="password-error"></span>
        </div>

        <div class="campo-opciones">
            <label class="recuerdame">
                <input type="checkbox" id="recuerdame"> Recuérdame
            </label>
            <a href="#" class="olvidaste">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" id="btnLogin">Iniciar Sesión</button>

    </form>

    <p class="registro-link">¿No tienes cuenta?</p>
    <a href="registro.html" class="btn-registro">Crear cuenta nueva</a>

    <div class="separador-google">
        <span>o</span>
    </div>

    <button type="button" id="btnGoogle" class="btn-google">
        <img src="logo_google.png" alt="Google" class="google-icon" width="20" height="20">
        Iniciar sesión con Google
    </button>

</div>

<script src="firebase-init.js"></script>
<script src="firebase-init.js"></script>
<script src="login.js"></script>
</body>
</html>
