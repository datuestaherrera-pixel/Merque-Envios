<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | MerqueEnvios</title>
    <link rel="stylesheet" href="registro.css">
</head>
<body>

<div class="registro-container">

    <div class="logo">
        <img src="logo_merqueenvios.jpg" alt="Logo MerqueEnvios">
    </div>

    <h2>Registro MerqueEnvios</h2>

    <form id="registroForm">
        <div class="campo">
            <label for="nombre">Nombres completos</label>
            <input type="text" id="nombre" placeholder="Ej: Juan Pérez" required>
            <span class="campo-error" id="nombre-error"></span>
        </div>

        <div class="campo">
            <label for="edad">Edad</label>
            <input type="number" id="edad" placeholder="Ej: 25" required>
            <span class="campo-error" id="edad-error"></span>
        </div>

        <div class="campo">
            <label for="fechaNacimiento">Fecha de nacimiento</label>
            <input type="date" id="fechaNacimiento" required>
            <span class="campo-error" id="fechaNacimiento-error"></span>
        </div>

        <div class="campo">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" placeholder="correo@ejemplo.com" required>
            <span class="campo-error" id="email-error"></span>
        </div>

        <div class="campo">
            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" placeholder="Ej: 3001234567" required>
            <span class="campo-error" id="telefono-error"></span>
        </div>

        <div class="campo">
            <label for="direccion">Dirección</label>
            <input type="text" id="direccion" placeholder="Ej: Calle 10 #20-30" required>
            <span class="campo-error" id="direccion-error"></span>
        </div>

        <button type="submit">Registrarse</button>
        <p class="login-link">¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p>
    </form>
</div>

<script src="registro.js"></script>
</body>
</html>
