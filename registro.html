<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | MerqueEnvios</title>
    <link rel="stylesheet" href="registro.css">
    <!-- CryptoJS for SHA-256 password hashing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>

<div class="registro-container">

    <div class="logo">
        <img src="img/logo_merqueenvios.jpg" alt="Logo MerqueEnvios">
    </div>

    <h2>Registro MerqueEnvios</h2>

    <form id="registroForm">
        <div class="campo">
            <label for="nombre">Nombres completos</label>
            <input type="text" id="nombre" placeholder="Ej: Juan Pérez" required>
            <span class="campo-error" id="nombre-error"></span>
        </div>

        <div class="campo">
            <label for="edad">Edad</label>
            <input type="number" id="edad" placeholder="Ej: 25" required>
            <span class="campo-error" id="edad-error"></span>
        </div>

        <div class="campo">
            <label for="fechaNacimiento">Fecha de nacimiento</label>
            <input type="date" id="fechaNacimiento" required>
            <span class="campo-error" id="fechaNacimiento-error"></span>
        </div>

        <div class="campo">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" placeholder="correo@ejemplo.com" required>
            <span class="campo-error" id="email-error"></span>
        </div>

        <div class="campo">
            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" placeholder="Ej: 3001234567" required>
            <span class="campo-error" id="telefono-error"></span>
        </div>

        <div class="campo">
            <label for="password">Contraseña</label>
            <div class="password-wrapper">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Crea tu contraseña"
                    required
                    autocomplete="new-password"
                    maxlength="64"
                    aria-describedby="password-error"
                >
                <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña" tabindex="-1">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
            <span class="campo-error" id="password-error"></span>
        </div>

        <div class="campo">
            <label for="confirmPassword">Confirmar contraseña</label>
            <div class="password-wrapper">
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Repite tu contraseña"
                    required
                    autocomplete="new-password"
                    maxlength="64"
                    aria-describedby="confirmPassword-error"
                >
                <button type="button" class="toggle-password" id="toggleConfirmPassword" aria-label="Mostrar contraseña" tabindex="-1">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
            <span class="campo-error" id="confirmPassword-error"></span>
        </div>

        <button type="submit">Registrarse</button>
        <p class="login-link">¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p>
    </form>
</div>

<script type="module" src="registro.js"></script>
</body>
</html>
